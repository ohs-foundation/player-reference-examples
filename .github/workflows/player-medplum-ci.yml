# PR validation for the player-medplum example. Runs ./gradlew check on every
# pull request and on pushes to main that touch this example. Catches test
# failures and compile errors before they reach a release tag.
#
# Every job runs against player-medplum/, not the repository root: `defaults.run`
# sets the shell working directory, and setup-gradle is told where the build
# lives. Action inputs that take paths (hashFiles, upload-artifact) are always
# workspace-relative and so carry the player-medplum/ prefix explicitly.

name: player-medplum CI

on:
  pull_request:
    paths:
      - 'player-medplum/**'
      - '.github/workflows/player-medplum-ci.yml'
  push:
    branches: [main]
    paths:
      - 'player-medplum/**'
      - '.github/workflows/player-medplum-ci.yml'

concurrency:
  # Cancel superseded PR runs (e.g. force-push); queue main pushes so we never
  # drop verification of a merge commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: player-medplum

jobs:
  spotless:
    name: Spotless (formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so spotless ratchet can walk back to the merge
          # base with main without hitting a missing-object error.
          fetch-depth: 0

      # actions/checkout only populates the ref it checked out (e.g.
      # refs/pull/<N>/merge), so `refs/remotes/origin/main` is still absent
      # and spotless ratchetFrom fails with "No such reference 'origin/main'".
      # Create it explicitly. Cheap since fetch-depth: 0 already has the objects.
      - name: Populate origin/main for spotless ratchet
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: player-medplum

      - name: Run spotlessCheck
        run: ./gradlew spotlessCheck --stacktrace

  check:
    name: Build + test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: jvm
            label: JVM/Desktop
            tasks: ':player-medplum-app:jvmTest'
            kotlinDaemonHeap: '-Xmx6g -XX:+UseG1GC'
            extraArgs: ''
          - id: android
            label: Android
            tasks: ':androidApp:lintDebug'
            kotlinDaemonHeap: '-Xmx6g -XX:+UseG1GC'
            extraArgs: ''
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: player-medplum

      - name: Run ${{ matrix.label }}
        run: >-
          ./gradlew ${{ matrix.tasks }}
          -Pkotlin.daemon.jvmargs="${{ matrix.kotlinDaemonHeap }}"
          ${{ matrix.extraArgs }}
          --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            player-medplum/**/build/reports/**
            player-medplum/**/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  ios-check:
    # iOS needs macOS runners (10× billing), so split by arch to avoid K/N
    # compiler contention on a single 14 GB runner. Debug link proves iOS
    # compiles/links; release link goes in the release workflow once iOS ships.
    name: iOS compile (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iosArm64
            target: IosArm64
          - label: iosSimulatorArm64
            target: IosSimulatorArm64
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: player-medplum

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('player-medplum/gradle/libs.versions.toml', 'player-medplum/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Compile + link ${{ matrix.label }}
        run: |
          ./gradlew --stacktrace \
            :player-medplum-app:linkDebugFramework${{ matrix.target }}
